<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Phishing Blocked</title>

<style>

body{
    font-family: Arial;
    background:#1c1c1c;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:#e74c3c;
    color:white;
    padding:30px;
    border-radius:10px;
    text-align:center;
    width:360px;
}

.details{
    margin-top:20px;
    text-align:left;
    background:white;
    color:black;
    padding:12px;
    border-radius:6px;
}

</style>

</head>

<body>

<div class="box">

<h2>&#128683; Phishing Website Blocked</h2>

<p>This website was detected as a phishing page.</p>
<p>Your security system prevented access.</p>

<div class="details">

<p><b>Risk Score:</b> <span id="risk"></span></p>
<p><b>ML Probability:</b> <span id="ml"></span></p>
<p><b>SSL Status:</b> <span id="ssl"></span></p>
<p><b>Domain Age:</b> <span id="age"></span> days</p>
<p><b>VT Malicious:</b> <span id="vtm"></span></p>
<p><b>VT Suspicious:</b> <span id="vts"></span></p>

</div>

<button id="backBtn">Go Back</button>

</div>

<script src="block.js"></script>

</body>

</html>
