<!DOCTYPE html>
<html>
<head>
<title>Blocked</title>
<style>
body {
    background: #e74c3c;
    color: white;
    text-align: center;
    padding-top: 100px;
}
.box {
    background: white;
    color: black;
    padding: 20px;
    display: inline-block;
    border-radius: 10px;
}
</style>
</head>
<body>

<h1>⚠️ Phishing Website Blocked</h1>

<div class="box" id="info"></div>

<script>
const params = new URLSearchParams(window.location.search);

document.getElementById("info").innerHTML = `
Risk Score: ${params.get("risk")} <br>
ML Probability: ${params.get("ml")} <br>
SSL Status: ${params.get("ssl")} <br>
Domain Age: ${params.get("age")} days
`;
</script>

</body>
</html>
